name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
        python: ['3.12']
        include:
          - os: ubuntu-22.04
            python: '3.10'
    env:
      VAULT_REQUIRE_GUI_TESTS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Linux display support
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth python3-tk
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test on Linux with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - name: Test on Windows and macOS
        if: runner.os != 'Linux'
        run: python -m pytest -q
